<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080c16" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>JARVIS · Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="extras.css" />
  <link rel="stylesheet" href="calendar.css" />
</head>
<body class="page-shell">

  <header class="cal-topbar" role="banner">
    <a class="cal-back" href="index.html" title="Back to dashboard">&larr; DASHBOARD</a>
    <div class="cal-title-block">
      <h1 class="cal-title">CALENDAR</h1>
      <div class="cal-sub" id="calSub">Loading aggregated events&hellip;</div>
    </div>
    <div class="cal-topbar-right">
      <span class="cal-status" id="calStatus">checking&hellip;</span>
      <button class="cal-refresh" id="calRefresh" type="button" title="Refresh from server">REFRESH</button>
    </div>
  </header>

  <nav class="cal-tabs" role="tablist" aria-label="Calendar tabs">
    <button class="cal-tab is-active" role="tab" aria-selected="true" data-tab="overview" type="button">OVERVIEW</button>
    <button class="cal-tab" role="tab" aria-selected="false" data-tab="classes" type="button">CLASSES</button>
    <button class="cal-tab" role="tab" aria-selected="false" data-tab="meetings" type="button">MEETINGS</button>
    <button class="cal-tab" role="tab" aria-selected="false" data-tab="assignments" type="button">ASSIGNMENTS</button>
    <button class="cal-tab" role="tab" aria-selected="false" data-tab="study" type="button">STUDY</button>
  </nav>

  <main class="cal-page" role="main">

    <section class="cal-toolbar panel" aria-label="Week navigation">
      <div class="cal-week-nav">
        <button class="cal-nav-btn" id="calPrev" type="button" aria-label="Previous week">&lsaquo;</button>
        <button class="cal-today-btn" id="calToday" type="button">TODAY</button>
        <button class="cal-nav-btn" id="calNext" type="button" aria-label="Next week">&rsaquo;</button>
      </div>
      <div class="cal-range" id="calRange">&hellip;</div>
      <label class="cal-month-pick">
        <span class="cal-month-label">MONTH</span>
        <select id="calMonth" class="cal-month-select"></select>
      </label>
    </section>

    <section class="cal-grid panel" id="calGridHost" aria-label="Week view">
      <div class="cal-empty" id="calEmpty">Loading&hellip;</div>
    </section>

  </main>

  <script src="calendar.js" defer></script>
</body>
</html>
