<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080c16" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>JARVIS · Classes · Life OS</title>

  <!-- Fonts: match Master Dashboard -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@300;400;500;600&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  />

  <!-- Dashboard shared tokens + utilities (provides .panel, --c-cyan, --c-orange, --surface, --f-display, --f-mono, ...) -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="extras.css" />
  <link rel="stylesheet" href="desktop.css" />
  <!-- Classes-specific styles (uses the same tokens; defines --c-amber, --c-good aliases) -->
  <link rel="stylesheet" href="classes.css" />

  <!-- Page-specific shell: enforce a calm background and consistent gutters -->
  <style>
    html, body { background: var(--c-bg, #0A0E17); }
    body { min-height: 100vh; }
    .cls-page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
  </style>
</head>
<body class="page-shell">
<div class="cls-page">

  <!-- ============ HEADER ============ -->
  <header class="cls-header panel">
    <a class="cls-back" href="index.html" aria-label="Back to dashboard">
      <span class="cls-back-arrow">&larr;</span>
      <span class="cls-back-label">DASHBOARD</span>
    </a>

    <div class="cls-title-block">
      <h1 class="cls-title">CLASSES</h1>
      <div class="cls-subtitle" id="cls-subtitle">&middot;</div>
    </div>

    <div class="cls-header-right">
      <span class="cls-status" id="cls-status">&hellip;</span>
      <span class="cls-status-label">CANVAS</span>
    </div>
  </header>

  <!-- ============ VIEW SWITCH ============ -->
  <nav class="cls-views" role="tablist" aria-label="Classes view">
    <button class="cls-view-btn is-active" role="tab" aria-selected="true" data-view="courses" type="button">COURSES</button>
    <button class="cls-view-btn" role="tab" aria-selected="false" data-view="calc" type="button">GRADE CALCULATOR</button>
  </nav>

  <!-- ============ COURSES VIEW ============ -->
  <div id="cls-course-view">
    <nav class="cls-tabs panel" id="cls-tabs" aria-label="Course tabs">
      <!-- Populated by classes.js -->
    </nav>
    <main class="cls-main" id="cls-main">
      <!-- One <section class="cls-panel"> per course, populated by classes.js -->
    </main>
  </div>

  <!-- ============ GRADE CALCULATOR VIEW ============ -->
  <div id="cls-calc-view" class="cls-calc-view" hidden></div>

  <!-- Classes module (inlines the Canvas client wrapper) -->
  <script src="classes.js" defer></script>
</div>
</body>
</html>
