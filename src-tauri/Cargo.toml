[package]
name = "jarvis-dashboard"
version = "0.1.0"
description = "JARVIS Dashboard — Tauri shell wrapping the live HUD"
authors = ["Evan Matute"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "jarvis_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true