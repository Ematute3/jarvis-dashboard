<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080c16" />
  <title>JARVIS · Syllabus Library</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="extras.css" />
  <link rel="stylesheet" href="syllabus.css" />
  <style>
    /* Page-specific overrides that need to beat styles.css ordering */
    .settings-bar { grid-template-columns: auto 1fr auto; }
    /* Force the viewer title to use the display font regardless of panel-title reset */
    .syllabus-headline .syllabus-title {
      font-family: var(--f-display);
    }
    /* Two-column shell must beat .page from extras.css (single column) */
    .page.syllabus-page {
      grid-template-columns: 300px 1fr;
      gap: 14px;
      align-items: stretch;
    }
    @media (max-width: 900px) {
      .page.syllabus-page { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="page-shell">

  <header class="topbar settings-bar" role="banner">
    <a class="topbar-back" href="index.html" title="Back to dashboard">← DASHBOARD</a>
    <div class="topbar-title">SYLLABUS LIBRARY</div>
    <div class="topbar-meta" id="sylStatus" data-state="">CONNECTING…</div>
  </header>

  <main class="page syllabus-page" role="main">
    <!-- Left column: course list -->
    <section class="panel course-list-panel" aria-label="Course list">
      <div class="panel-header">
        <span class="panel-title">COURSES</span>
        <span class="panel-tag" id="courseCount">0 TOTAL</span>
      </div>
      <ul class="course-list" id="courseList" role="listbox" aria-label="Courses">
        <li class="course-empty">Loading courses…</li>
      </ul>
    </section>

    <!-- Right column: syllabus viewer -->
    <article class="panel syllabus-panel" aria-live="polite" aria-label="Syllabus viewer">
      <div class="panel-header syllabus-head">
        <div class="syllabus-headline">
          <span class="syllabus-code" id="sylCode">—</span>
          <h2 class="syllabus-title" id="sylTitle">Select a course</h2>
          <span class="syllabus-instructor" id="sylInstructor">&nbsp;</span>
        </div>
        <div class="syllabus-meta">
          <span class="meta-chip" id="sylTerm">—</span>
          <span class="meta-chip" id="sylCredits">—</span>
        </div>
      </div>

      <div class="syllabus-body" id="sylBody">
        <p class="syl-empty">Select a course on the left to view its syllabus.</p>
      </div>
    </article>
  </main>

  <script src="syllabus.js" defer></script>
</body>
</html>
